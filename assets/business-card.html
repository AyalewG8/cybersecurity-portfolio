<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ayalew Cherenet | Digital Business Card</title>
  <style>
    :root { --bg:#07111f; --panel:#0f2237; --text:#eef6ff; --muted:#a7b8ca; --accent:#49d6c7; --accent2:#7ca8ff; }
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top right,rgba(73,214,199,.14),transparent 30%),var(--bg);font-family:Inter,Arial,sans-serif;color:var(--text);padding:28px}
    .wrap{display:grid;gap:22px;justify-items:center}.card{width:3.5in;height:2in;border-radius:18px;background:linear-gradient(145deg,#10243a,#091624);border:1px solid rgba(255,255,255,.12);box-shadow:0 24px 70px rgba(0,0,0,.35);padding:.24in;display:grid;grid-template-columns:1fr auto;gap:18px;position:relative;overflow:hidden}.card:after{content:"";position:absolute;width:180px;height:180px;border:1px solid rgba(73,214,199,.18);border-radius:50%;right:-55px;top:-65px}.brand{font-weight:800;letter-spacing:.02em}.mark{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;background:rgba(73,214,199,.12);border:1px solid rgba(73,214,199,.4);color:var(--accent);margin-bottom:12px}.title{font-size:14px;color:var(--accent);font-weight:700;margin:4px 0 8px}.meta{font-size:11px;color:var(--muted);line-height:1.6}.right{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;text-align:right}.tag{font-size:10px;color:#04121d;background:linear-gradient(90deg,var(--accent),#6fe5ba);padding:7px 9px;border-radius:999px;font-weight:800}.url{font-size:10px;color:var(--accent2);max-width:120px;word-break:break-word}.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.actions a,.actions button{border:1px solid rgba(255,255,255,.14);background:#10243a;color:white;padding:11px 16px;border-radius:10px;text-decoration:none;font-weight:700;cursor:pointer}.actions a.primary{background:linear-gradient(90deg,var(--accent),#6fe5ba);color:#04121d;border:none}@media print{body{background:white;padding:0}.wrap{display:block}.actions{display:none}.card{box-shadow:none;border:1px solid #bbb;margin:0}}@media(max-width:500px){.card{width:min(100%,3.5in);height:auto;min-height:2in}}
  </style>
</head>
<body>
  <div class="wrap">
    <section class="card" aria-label="Ayalew Cherenet business card">
      <div>
        <div class="mark">AC</div>
        <div class="brand">Ayalew Cherenet</div>
        <div class="title">Cybersecurity & Information Technology</div>
        <div class="meta">Dallas, Texas<br>chereneta@gmail.com<br>github.com/AyalewG8</div>
      </div>
      <div class="right">
        <div class="tag">Open to Opportunities</div>
        <div class="url">ayalewg8.github.io/cybersecurity-portfolio/</div>
      </div>
    </section>
    <div class="actions"><a class="primary" href="../index.html">Back to Portfolio</a><button onclick="window.print()">Print / Save as PDF</button></div>
  </div>
</body>
</html>
