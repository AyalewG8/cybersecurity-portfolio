title: Repeated Outbound Requests to One Rare Destination
id: 4b6540ab-561d-4ed0-8715-4da31a555ae5
status: experimental
description: Selects successful outbound requests for timing analysis by source and destination.
author: Ayalew Cherenet
date: 2026-09-13
tags:
  - attack.command_and_control
  - attack.t1071.001
logsource:
  category: proxy
detection:
  selection:
    http.response.status_code: 200
    http.request.method:
      - GET
      - POST
  filter_approved:
    destination.domain|endswith:
      - '.company.example'
      - '.microsoft.com'
      - '.office365.com'
  condition: selection and not filter_approved
falsepositives:
  - Monitoring or software-update agents
  - Unapproved but legitimate synchronization software
level: medium
