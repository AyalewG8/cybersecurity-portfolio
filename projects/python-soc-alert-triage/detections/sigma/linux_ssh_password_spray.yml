title: Linux SSH Password Spray Activity
id: 1a8a73fa-266c-4bb5-9464-a8c91cc37701
status: experimental
description: Selects failed SSH password events for distinct-account aggregation by source.
author: Ayalew Cherenet
date: 2026-09-13
tags:
  - attack.credential_access
  - attack.t1110.003
logsource:
  product: linux
  service: sshd
detection:
  selection:
    event.outcome: failure
    authentication.method: password
  filter_local:
    source.ip|startswith:
      - '10.'
      - '172.16.'
      - '192.168.'
  condition: selection and not filter_local
falsepositives:
  - Authorized password-audit activity
  - Misconfigured automation using multiple accounts
level: medium
